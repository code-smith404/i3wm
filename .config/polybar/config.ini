[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #cba6f7
secondary = #89b4fa
alert = #f38ba8
warning = #f9e2af
ok = #a6e3a1
disabled = #6c7086

[bar/main]
width = 100%
height = 30pt
radius = 10
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 6pt
border-color = #00000000
padding-left = 2
padding-right = 2
module-margin = 2
separator = " "
separator-foreground = ${colors.disabled}
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = JetBrainsMono Nerd Font:size=12;3
modules-left = playerctl net-speed
modules-center = date
modules-right = cputemp cpu memory backlight pulseaudio battery
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

[module/playerctl]
type = custom/script
exec = ~/.config/polybar/scripts/playerctl.sh
interval = 2
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous
format-foreground = ${colors.foreground}

[module/net-speed]
type = custom/script
exec = ~/.config/polybar/scripts/net-speed.sh
interval = 1
format-foreground = ${colors.secondary}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.primary}
format-padding = 1

[module/cputemp]
type = custom/script
exec = sensors 2>/dev/null | grep -A 0 'Package id 0\|Tctl\|Core 0' | head -n1 | awk '{gsub(/[+°C]/,""); print $NF"°C"}'
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.warning}
label = %output%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.ok}
label = %gb_used%/%gb_total%

[module/backlight]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
interval = 3
format-foreground = ${colors.foreground}
click-left = brightnessctl set +5%
click-right = brightnessctl set 5%-

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 2
format-volume = <ramp-volume> <label-volume>
format-muted = 󰝟 <label-muted>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.secondary}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = ADP1
poll-interval = 5
format-charging = 󰂄 <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = 󰁹 <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = Full
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-foreground = ${colors.warning}
format-charging-foreground = ${colors.ok}
format-full-foreground = ${colors.ok}
