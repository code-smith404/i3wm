[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #cba6f7
secondary = #89b4fa
alert = #f38ba8
disabled = #6c7086

[bar/main]
width = 100%
height = 30
radius = 8
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
border-size = 4
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 1
separator = "  "
separator-foreground = ${colors.disabled}
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=12;2
modules-left = xworkspaces media netspeed
modules-center = date
modules-right = cpu temp memory brightness pulseaudio battery
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
tray-position = right

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = #1e1e2e
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
interval = 2
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous
label = %output%

[module/netspeed]
type = custom/script
exec = ~/.config/polybar/scripts/netspeed.sh
interval = 2
label = %output%

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date% %time%
label-foreground = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/temp]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70
format = <label>
format-prefix = " TEMP "
format-prefix-foreground = ${colors.primary}
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " RAM "
format-prefix-foreground = ${colors.primary}
label = %gb_used%

[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
interval = 2
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-
label = %output%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
label-muted =  muted
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = ADP1
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-charging = %percentage%%
label-discharging = %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-framerate = 750
