# Picom compositor config (low-end friendly)
backend = "glx";
vsync = true;
glx-no-stencil = true;

# Shadows (small, simple)
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.25;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "fullscreen"
];

# Fading (light)
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# Transparency
inactive-opacity = 0.95;
active-opacity = 1.0;

# Blur (dual_kawase, low strength)
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Firefox'",
  "class_g = 'Chromium'",
  "class_g = 'Google-chrome'",
  "class_g = 'mpv'",
  "class_g = 'Vlc'",
  "fullscreen"
];

# Rounded corners
corner-radius = 9;
round-borders = 1;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Other
mark-wmwin-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
log-level = "warn";
